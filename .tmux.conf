# 1. ENABLING BOTH PREFIXES
set -g prefix C-a
set -g prefix2 C-b         # This allows both Ctrl+a and Ctrl+b to work
bind-key C-a send-prefix
bind-key C-b send-prefix

set -g @plugin "arcticicestudio/nord-tmux"

set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# set -g status on
# set -g status-interval 2
# set -g status-fg colour231
# set -g status-bg colour234
# set -g status-left-length 20
# set -g status-left '#[fg=green,bg=colour234,nobold] #(whoami)  '
# set -g status-right "#[fg=yellow] %d %b %Y #[fg=green]:: %l:%M %p"
# set -g status-right-length 150
# set -g window-status-format "#[fg=colour234,bg=colour234]#[fg=colour244,bg=colour234](#I)#[default] #W #[fg=colour234,bg=colour234]"
# set -g window-status-current-format "#[fg=colour4,bg=colour234]#[fg=colour0,bg=colour4](#I) #W #[fg=colour4,bg=colour234,nobold]"

# 2. SPLIT WINDOWS (Keeping both old and new)
# We just don't 'unbind' the originals
bind | split-window -h
bind - split-window -v

# 3. YOUR NEW CLEAR SHORTCUT
# This clears the active pane's history even if a server is running
bind -n C-k clear-history

# 4. RELOAD CONFIG
unbind r
bind r source-file ~/.tmux.conf

# 5. RESIZING (The -r flag explained below)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# 6. MOUSE & VIM KEYS
set -g mouse on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# 7. PANE JOINING
bind-key J command-prompt -p "join pane from:" "join-pane -s '%%'"

# 8. PLUGINS (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "nordtheme/tmux"

# Navigation mappings
set -g @vim_navigator_mapping_left "C-Left C-h"
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"

set -g set-clipboard on

# Enable automatic restore
set -g @continuum-restore 'on'

# Optional: Set the save interval (default is 15 minutes)
set -g @continuum-save-interval '5'

# Optional: Make tmux-resurrect capture pane contents and shell history
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
