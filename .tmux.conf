# 0. FIX THE PATH (Ensures plugins can find tmux on macOS)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

# 1. DISABLE DEFAULT PREFIX
set -g prefix C-b
unbind C-a
bind C-b send-prefix

# Set terminal colors correctly
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 2. SPLIT WINDOWS
# Opens new panes in the same directory as the current pane
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 3. CLEAR SHORTCUT
# Clears the active pane's history
bind -n C-k clear-history

# 4. RELOAD CONFIG
unbind r
bind r source-file ~/.tmux.conf

# 5. RESIZING
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# 6. MOUSE & VIM KEYS
set -g mouse on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# 7. PANE JOINING
bind-key J command-prompt -p "join pane from:" "join-pane -s '%%'"

# 7b. SYNCHRONIZE-PANES TOGGLE
# Broadcast keystrokes to all panes. Off by default; toggle with prefix + S.
# Reloading the config (prefix + r) always forces it back off so it can't
# get stuck on and leak keys (e.g. stray ^[ from Shift+Enter) into other panes.
setw -g synchronize-panes off
bind S setw synchronize-panes \; display "sync #{?pane_synchronized,ON,OFF}"

# 8. PLUGINS (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "nordtheme/tmux"

# 9. NAVIGATION MAPPINGS (Vim-Tmux-Navigator)
set -g @vim_navigator_mapping_left "C-Left C-h"
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"

# 10. PERSISTENCE SETTINGS (Resurrect & Continuum)
set -g set-clipboard on
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g status-interval 5
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# CRITICAL: This helps the background script find the tmux binary
set -g @continuum-boot 'on'

# Initialize TMUX plugin manager (Keep this near the very last line)
run '~/.tmux/plugins/tpm/tpm'

# 11. SYNC BADGE (must come AFTER the theme sets status-right)
# Appends a red "SYNC" badge to the far right whenever synchronize-panes is on,
# so a stuck broadcast is impossible to miss. Commas are escaped as #, inside
# the #[...] style so tmux doesn't read them as format separators.
set -ag status-right "#{?pane_synchronized,#[fg=black#,bg=red#,bold] SYNC #[default],}"
