# Herdr config — ported from ~/dotfiles/.tmux.conf
# Docs: https://herdr.dev/docs/configuration/  ·  https://herdr.dev/docs/keyboard/
# Live location: ~/.config/herdr/config.toml  (symlink this file there — see readme)
#
# Two deliberate departures from herdr defaults, matching Eric's tmux muscle memory:
#   1. Pane focus is CTRL-ONLY  (ctrl+h/j/k/l)  — was vim-tmux-navigator's C-h/j/k/l
#   2. Indexed tab jumps are CTRL-ONLY (ctrl+1..9) — herdr default is prefix+1..9

onboarding = false

[keys]
# Keep the tmux prefix so the rest of the default chord vocabulary still applies.
prefix = "ctrl+b"

# --- Pane focus — CTRL-ONLY (tmux: vim-tmux-navigator C-h / C-j / C-k / C-l) ---
# NOTE: these become GLOBAL chords, so herdr swallows them before the shell/vim.
#   ctrl+h is normally Backspace (usually harmless — most terminals send DEL 0x7f)
#   ctrl+j is normally Enter/newline, ctrl+l is normally clear-screen.
# If any of those bite, switch this block to ctrl+alt+h/j/k/l (herdr's recommended
# collision-free chord). tmux avoided this via vim-tmux-navigator's smart passthrough,
# which herdr does not replicate.
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# --- Indexed jumps (2026-07-06 rework: tabs→CMD, workspaces→CTRL) ---
# Rationale: with herdr now the whole terminal life, reclaim macOS cmd+1..9
# (was iTerm2 tab-switch) to drive herdr TABS, and demote workspaces to ctrl+1..9.
# HOW cmd reaches herdr: NOT a global Cmd→Super remap (that would swallow cmd+C/V
# inside herdr). Instead iTerm2 has a SURGICAL per-key mapping for ONLY these chords
# that sends the Kitty-protocol super-encoded CSI-u sequence — so the token is
# `super`, not `cmd` (herdr sees the super bit). Everything else on cmd (copy/paste/
# find) stays with iTerm2. iTerm2 setup + escape table: see the KB doc below.
#   cmd+1 → ESC[49;9u  …  cmd+9 → ESC[57;9u   (super = kitty mod 8, sent as 9)
switch_tab       = "super+1..9"   # cmd+1..9  → tab 1–9        (was ctrl+1..9)
switch_workspace = "ctrl+1..9"    # ctrl+1..9 → workspace 1–9  (was ctrl+shift+1..9; ctrl+shift removed)

# --- Agent layer (all three ship UNSET in herdr) ---
# focus_agent has NO herdr default despite older notes here — it must be bound explicitly.
# Cycling is GLOBAL ctrl+alt (not a prefix chord) — mirrors ctrl-only pane focus,
# and a single-press global chord is more reliable than prefix-then-alt.
focus_agent    = "prefix+alt+1..9"  # jump to agent N (indexed)
next_agent     = "ctrl+alt+j"       # cycle forward — global (vim j = down/next)
previous_agent = "ctrl+alt+k"       # cycle back    — global (vim k = up/prev)

# --- Splits (functional match to tmux; note the naming inversion) ---
# tmux prefix+|  = split -h = side-by-side   -> herdr split_vertical  (vertical divider)
# tmux prefix+-  = split -v = stacked        -> herdr split_horizontal (horizontal divider)
split_vertical   = "prefix+|"     # literal pipe glyph — herdr reconciles physical shift+\ (NOT "shift+backslash")
split_horizontal = "prefix+minus"

# --- Pane management ---
zoom        = "prefix+z"   # tmux: prefix+m (resize-pane -Z)
close_pane  = "prefix+x"
resize_mode = "prefix+r"   # enter resize mode, then h/j/k/l (tmux: prefix+h/j/k/l, repeatable)
swap_pane_left  = "prefix+shift+h"
swap_pane_down  = "prefix+shift+j"
swap_pane_up    = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# --- Tabs (tmux "windows") ---
new_tab      = "prefix+c"
# Cycle tabs with cmd+shift+[ / ] (2026-07-06) as the PRIMARY desktop cycler.
# ] = next, [ = prev (browser/vim convention). super = iTerm2-forwarded cmd.
# NOTE: punctuation+shift+super over Kitty is the least-certain chord here — if it
# won't fire, fall back to prefix+n/p or move to cmd+shift+n/p.
#
# MULTI-BIND via ARRAY (per official docs https://herdr.dev/docs/keyboard/): a herdr action
# accepts a LIST of keystrings — e.g. `focus_pane_left = ["prefix+h", "ctrl+alt+h"]`. Both keys
# fire the action. So we bind the custom desktop chord AND herdr's default together: the default
# prefix+n/prefix+p keeps the moshi (mobile) tab-swipe gesture working, while ⌘⇧]/⌘⇧[ drives it
# on desktop (iTerm2 forwards ⌘⇧]→ESC[93;10u, ⌘⇧[→ESC[91;10u via iterm-herdr-cmd-keys.sh).
# NOTE: `reload-config` does NOT emit a diagnostic for a bad element inside an array (only for a
# bad SCALAR key) — so "diagnostics:[] / applied" does not by itself prove every element bound;
# confirm array chords by actually pressing them.
next_tab     = ["super+shift+]", "prefix+n"]   # desktop ⌘⇧]  ·  moshi swipe / ctrl+b n
previous_tab = ["super+shift+[", "prefix+p"]   # desktop ⌘⇧[  ·  moshi swipe / ctrl+b p
close_tab    = "prefix+shift+x"

# --- Workspaces (cycle) — cmd+shift+j/k (2026-07-06) ---
# j = next, k = prev (vim + matches next_agent/previous_agent = ctrl+alt+j/k).
# Indexed workspace jump is switch_workspace = ctrl+1..9 (see above).
next_workspace     = "super+shift+j"
previous_workspace = "super+shift+k"

# --- Session / misc ---
detach    = "prefix+q"   # tmux: prefix+d
copy_mode = "prefix+["    # vi-style copy mode

# --- One-shot pane resize (2026-07-06) — tmux `bind -r h/j/k/l resize-pane ±5` port ---
# ⚠️ MUST BE THE LAST THING IN [keys]: `[[keys.command]]` is a TOML array-of-tables, which
# ENDS the [keys] table. Any scalar binding (next_tab, previous_tab, workspaces, copy_mode…)
# placed AFTER these blocks gets absorbed into the last command table and silently dropped
# from [keys] → herdr falls back to that action's DEFAULT. (This bit us 2026-07-06: the
# blocks were mid-[keys] and killed ⌘⇧]/⌘⇧[.) Keep [[keys.command]] at the very end.
#
# herdr 0.7.1 has NO resize_pane_* keybind action (binary-verified: only resize_mode/zoom),
# but [[keys.command]] type="shell" + the `herdr pane resize` CLI gets the same effect.
# prefix+h/j/k/l is FREE here because pane focus is ctrl-only (see top of [keys]).
# Semantics: --direction X MOVES THE PANE'S X-SIDE BORDER outward (grows the pane that
# way); --amount is a split-RATIO fraction clamped to 0.1..0.9 (NOT cells — 5 ≈ slam to
# clamp). 0.05 ≈ tmux's "5 cells" feel on a full-width split. Not repeatable (prefix
# needed each press) — for continuous adjustment use resize_mode (prefix+r, then hjkl).
# Verified live: --current resolves to the FOCUSED pane server-side.
[[keys.command]]
key = "prefix+h"
type = "shell"
command = "herdr pane resize --direction left --amount 0.05 --current"

[[keys.command]]
key = "prefix+j"
type = "shell"
command = "herdr pane resize --direction down --amount 0.05 --current"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = "herdr pane resize --direction up --amount 0.05 --current"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "herdr pane resize --direction right --amount 0.05 --current"

[theme]
# Nord to match the rest of the dotfiles (tmux/iTerm2/p10k all Nord).
# Confirmed bundled in herdr 0.7.1 (`herdr --default-config` lists it).
name = "nord"

# --- Readability overrides (2026-07-06) ---
# Problem: sidebar agent-group status labels (idle / working / done / claude)
# render in Nord's muted tokens (overlay0/overlay1/subtext0 ≈ #4c566a dark
# blue-grays). With iTerm2 window transparency the desktop wallpaper bleeds
# through the sidebar, so those dim labels become near-invisible.
# Fix: keep the Nord family but lift the muted tokens into the snow-storm range
# so secondary text stays legible over a busy translucent background.
# Token names are herdr's Catppuccin-style palette roles (from the binary):
#   text/subtext0 = primary/secondary fg · overlay0/1 = muted · panel_bg/surface* = chrome bg
[theme.custom]
# Readability tuning for the translucent iTerm2 window (2026-07-06).
# ROOT FIX: a SOLID sidebar/panel background so the desktop wallpaper can't
# bleed through and wash out dim labels.
# SOURCE-VERIFIED against herdr src (config/theme.rs:32-49, ui/status.rs:231-239):
#   Agent STATUS labels use SEMANTIC tokens — idle->green, working->yellow,
#   done->teal, blocked->red, unknown->overlay0. The agent NAME label
#   (claude/codex/...) uses overlay0 +DIM for ALL agents. Leave the semantic
#   tokens on base Nord — overriding green=#00ff88 is what caused neon labels.
#   Only 16 tokens are valid (accent panel_bg surface0 surface1 surface_dim
#   overlay0 overlay1 text subtext0 mauve green yellow red blue teal peach);
#   there is NO `default`/`on` key — serde silently drops unknown keys, so the
#   old default=/on= lines were dead no-ops. Primary fg is `text`.
panel_bg    = "#2e3440"   # Nord0 — solid sidebar bg, stops wallpaper bleed
surface_dim = "#2e3440"   # active agent-row background fill
# Lift only the muted tokens so dim sidebar text stays legible:
subtext0 = "#d0d8ea"   # inactive workspace/tab title row
overlay1 = "#c9d3e8"   # muted label (higher tier)
overlay0 = "#c2cce2"   # agent-name label + unknown status + muted UI — lifted from Nord ~#4c566a

[ui]
sidebar_width = 32
mouse_capture = true       # tmux: set -g mouse on

# --- Sound (2026-07-06) — herdr now owns the done/needs-attention chimes ---
# Replaces the old Claude Code afplay hooks (smb_kick / smb_coin), removed from
# ~/.claude/settings.json the same day. herdr plays its built-in sounds when an
# agent CHANGES STATE — done (finished) or request (needs your input).
# SCOPE CAVEAT (by herdr design, src/sound.rs): sounds fire only for agents in
# BACKGROUND workspaces — the pane you're actively focused on stays silent
# (you can already see it finish). There is NO "also sound the focused pane"
# switch in herdr 0.7.1. Kill-switch env: HERDR_DISABLE_SOUND=1.
[ui.sound]
enabled = true
# No custom paths → herdr's built-in default chimes for both done + request.
# To customise later: path / done_path / request_path = "sounds/x.mp3" (mp3 only,
# relative to this file's dir). The Downloads/*.wav files won't work (wav ≠ mp3).

# Per-agent: default | on | off. Global enabled=true already sounds every agent
# EXCEPT droid, which herdr mutes by default — unmute it so "all agents" holds.
[ui.sound.agents]
droid = "on"

[session]
# tmux-resurrect/continuum equivalent. On a Herdr SERVER restart (herdr update,
# crash, or a full OS reboot where you relaunch `herdr`), reconnect supported
# agent panes to their NATIVE conversation sessions instead of a blank shell.
# Requires the agent's official integration to be installed so it reports a
# session ref — verified present: `herdr integration status` shows claude/codex/
# opencode = current. Without that integration this key is a silent no-op.
resume_agents_on_restore = true

[experimental]
# Restore recent pane SCROLLBACK TEXT across a full server restart, so panes
# come back with their prior output visible (not just the layout). Complements
# [session] above: resume_agents_on_restore reconnects the agent conversation;
# pane_history brings back what was on screen. Experimental per herdr docs.
pane_history = true

# --- Not ported / no 1:1 herdr equivalent (kept here as a record) ---
# tmux prefix+h/j/k/l resize ±5 -> PORTED 2026-07-06 via [[keys.command]] + CLI (see above)
# tmux prefix+m resize-pane -Z  -> herdr zoom = prefix+z (bound above)
# tmux C-k clear-history        -> no herdr action (and ctrl+k is now pane-focus-up)
# tmux prefix+J join-pane       -> no direct herdr equivalent
# tmux prefix+S sync-panes      -> no herdr equivalent
# tmux prefix+r reload-config   -> herdr reloads config itself; no keybind needed
# resurrect/continuum persist   -> IMPLEMENTED above via [session] resume_agents_on_restore
